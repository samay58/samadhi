name: Samadhi
options:
  bundleIdPrefix: com.samaydhawan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SamadhiKit:
    path: Packages/SamadhiKit
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ZL5U59XBJ6
targets:
  Samadhi:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
        excludes:
          - "AutoFeedback"
          - "AutoFeedback/**"
      # A folder reference keeps AutoFeedback/<family>/ intact in the bundle. The prototype file
      # names repeat across families, so a flattened resource phase would collide.
      - path: Resources/AutoFeedback
        type: folder
        buildPhase: resources
    dependencies:
      - package: SamadhiKit
        product: SamadhiDomain
      - package: SamadhiKit
        product: SamadhiDesign
      - package: SamadhiKit
        product: SamadhiMotion
      - package: SamadhiKit
        product: SamadhiAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samaydhawan.Samadhi
        PRODUCT_NAME: Samadhi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Samadhi-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Capture source fingerprint
        script: |
          "$SRCROOT/Scripts/capture-source-fingerprint.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed build identity
        script: |
          "$SRCROOT/Scripts/embed-build-identity.sh"
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
          - "$(DERIVED_FILE_DIR)/SamadhiSourceFingerprint.txt"
        basedOnDependencyAnalysis: false
  SamadhiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SamadhiTests
    dependencies:
      - target: Samadhi
      - package: SamadhiKit
        product: SamadhiDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samaydhawan.SamadhiTests
        GENERATE_INFOPLIST_FILE: YES
  SamadhiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SamadhiUITests
    dependencies:
      - target: Samadhi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samaydhawan.SamadhiUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Samadhi:
    build:
      targets:
        Samadhi: all
        SamadhiTests: [test]
        SamadhiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SamadhiTests
        - SamadhiUITests
  Samadhi MusicKit Gate:
    build:
      targets:
        Samadhi: all
    run:
      config: Debug
      commandLineArguments:
        "--music-feasibility": true
  Samadhi Apple Music Core Loop:
    build:
      targets:
        Samadhi: all
    run:
      config: Debug
      commandLineArguments:
        "--apple-music-core-loop": true
  Samadhi Feedback Audition:
    build:
      targets:
        Samadhi: all
    run:
      config: Debug
      commandLineArguments:
        "--feedback-audition": true
